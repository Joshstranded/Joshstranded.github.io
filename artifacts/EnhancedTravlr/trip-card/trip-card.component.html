<div class="card shadow-sm border-0 h-100">

  <img
    [src]="'http://localhost:3000/images/' + trip.image"
    class="card-img-top"
    alt="trip image"
    style="height:220px; object-fit:cover;"
  />

  <div class="card-body d-flex flex-column">

    <h4 class="card-title fw-bold text-primary mb-2">
      {{ trip.name }}
    </h4>

    <p class="text-muted mb-3">
      {{ trip.description }}
    </p>

    <hr>

    <div class="mb-2">
      <strong>🏝 Resort:</strong><br>
      {{ trip.resort }}
    </div>

    <div class="mb-2">
      <strong>🌙 Length:</strong><br>
      {{ trip.length }}
    </div>

    <div class="mb-3">
      <strong>💲 Price:</strong><br>
      {{ trip.perPerson }}
    </div>

    <div class="mt-auto">

      <button
        *ngIf="isLoggedIn()"
        class="btn btn-success w-100"
        (click)="editTrip(trip)">
        ✏ Edit Trip
      </button>

    </div>

  </div>

</div>
